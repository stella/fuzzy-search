[package]
name = "stella-fuzzy-search-core"
version = "1.1.3"
edition = "2024"
rust-version = "1.88"
description = "Approximate substring matching core"
license = "MIT"
publish = ["crates-io"]
repository = "https://github.com/stella/fuzzy-search"
homepage = "https://github.com/stella/fuzzy-search"
documentation = "https://docs.rs/stella-fuzzy-search-core"
readme = "README.md"
keywords = ["fuzzy-search", "levenshtein", "search", "text"]
categories = ["text-processing"]

[dependencies]
bon = "3.9.3"
unicode-case-mapping = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"

[lints]
workspace = true
