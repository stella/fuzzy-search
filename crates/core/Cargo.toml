[package]
name = "stella-fuzzy-search-core"
version = "1.3.0"
edition = "2024"
rust-version = "1.88"
description = "Approximate substring matching core"
license = "Apache-2.0"
publish = ["crates-io"]
repository = "https://github.com/stella/fuzzy-search"
homepage = "https://github.com/stella/fuzzy-search"
documentation = "https://docs.rs/stella-fuzzy-search-core"
readme = "README.md"
keywords = ["fuzzy-search", "levenshtein", "search", "text"]
categories = ["text-processing"]

[dependencies]
bon = "3.9.3"
fst = "0.4.7"
unicode-case-mapping = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"

[dev-dependencies]
proptest = "1.11"
criterion = { version = "0.8.2", default-features = false }
sha2 = "0.10"

[[bench]]
name = "entity_lexicon"
harness = false

[[bench]]
name = "entity_random_tokens"
harness = false

[lints]
workspace = true
