version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "actions/checkout"
      - dependency-name: "oven-sh/setup-bun"
      - dependency-name: "actions/setup-node"
      - dependency-name: "actions/setup-python"
      - dependency-name: "astral-sh/setup-uv"
      - dependency-name: "actions/cache"
      - dependency-name: "actions/cache/restore"
      - dependency-name: "actions/cache/save"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
      - dependency-name: "stella/.github/.github/workflows/package-consumer-compat.yml"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/wasm"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "oxlint"
      - dependency-name: "oxlint-tsgolint"
      - dependency-name: "@oxlint/plugins"
      - dependency-name: "@stll/oxlint-plugin"
      - dependency-name: "oxfmt"
      - dependency-name: "lefthook"
      - dependency-name: "typescript"
      - dependency-name: "@typescript/native"
      - dependency-name: "typescript-compat"
      - dependency-name: "bun-types"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
