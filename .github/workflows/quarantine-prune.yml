name: Package quarantine prune

on:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read

jobs:
  prune:
    name: Remove expired quarantine exceptions
    if: github.repository == 'stella/fuzzy-search'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-prune.yml@07debc754995bab35e446511859f1d93e1ad127a
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
