name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        labeled,
      ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-changed: ${{ steps.filter.outputs.rust }}
      build-changed: ${{ steps.filter.outputs.build }}
      provenance-changed: ${{ steps.filter.outputs.provenance }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            rust:
              - '.github/workflows/**'
              - 'VERSION'
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            build:
              - '.github/workflows/**'
              - 'VERSION'
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'bun.lock'
              - 'index.cjs'
              - 'tsdown.config.ts'
              - 'scripts/**'
              - 'wasm/**'
              - 'npm/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            provenance:
              - '.github/workflows/**'
              - 'VERSION'
              - 'bun.lock'
              - 'Cargo.lock'
              - '**/package.json'
              - 'Cargo.toml'
              - 'src/**'
              - 'crates/**'
              - 'wasm/**'
              - '*.js'
              - '*.cjs'
              - '*.mjs'
              - '.provenance.yml'
              - 'provenance/**'
              - '.github/workflows/ci.yml'

  trust-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          HEAD_REPO: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ '${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}' == 'true' ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped."
          fi

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request'
      && needs.trust-check.outputs.trusted == 'true'
    needs: [trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: stella/.github/.github/actions/changeset-policy@c47bb87cc82047b5fdc2540983148d4e3efa9a37 # v1.3.0
        with:
          release-paths: |
            src/**
            crates/core/src/**
            Cargo.toml
            crates/core/Cargo.toml
            package.json
            wasm/package.json
            index.cjs
            tsdown.config.ts
          generated-paths: |
            CHANGELOG.md
            VERSION
            Cargo.toml
            crates/core/Cargo.toml
            Cargo.lock
            bun.lock
            package.json
            wasm/package.json
            npm/*/package.json
            index.cjs
            provenance/THIRD-PARTY-NOTICES.txt
            provenance/report.json
            provenance/sbom.cdx.json
          package-files: package.json

  napi-ci:
    if: ${{ always() && !cancelled() && needs.check-changes.result == 'success' && (needs.trust-check.result == 'success' || needs.trust-check.result == 'skipped') }}
    needs: [check-changes, trust-check]
    uses: stella/.github/.github/workflows/rust-napi-ci.yml@90c81b47c5fee6dc88e67d432cc6951e88a6724e
    with:
      node-version: "22"
      trusted: ${{ (github.event_name != 'pull_request' || needs.trust-check.outputs.trusted == 'true') && 'true' || 'false' }}
      rust-changed: ${{ needs.check-changes.outputs.rust-changed }}
      build-changed: ${{ needs.check-changes.outputs.build-changed }}
      provenance-changed: ${{ needs.check-changes.outputs.provenance-changed }}
      provenance-version: v0.1.3
      property-test-command: bun run test:props
      install-command: bun install --frozen-lockfile
    secrets: inherit

  core-package:
    name: Core crate package
    if: >-
      always()
      && !cancelled()
      && needs.check-changes.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Verify publication boundary
        run: |
          set -euo pipefail
          cmp LICENSE crates/core/LICENSE
          cargo metadata --format-version 1 --no-deps | jq -e '
            (.packages[] | select(.name == "stella-fuzzy-search").publish) == []
            and (.packages[] | select(.name == "stella-fuzzy-search-core").publish) == ["crates-io"]
          '
      - name: Verify crates.io package
        run: cargo publish --dry-run --locked --package stella-fuzzy-search-core
