name: CI

env:
  HAWK_RUST_TOOLCHAIN: "1.97.1"
  HAWK_VERSION: "0.1.12"
  HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256: "f9cafbbc5777b2b00c362619b8b62af942d2900a121acae2e73210a8ebffd857"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    needs: [trust-check]
    if: >-
      always() && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-changed: ${{ (steps.filter.outputs.rust == 'true' || steps.toolchain.outputs.changed == 'true') && 'true' || 'false' }}
      build-changed: ${{ (steps.filter.outputs.build == 'true' || steps.toolchain.outputs.changed == 'true') && 'true' || 'false' }}
      provenance-changed: ${{ (steps.filter.outputs.provenance == 'true' || steps.toolchain.outputs.changed == 'true') && 'true' || 'false' }}
      toolchain-changed: ${{ steps.toolchain.outputs.changed }}
      node-version: ${{ steps.runtime.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Read selected Node runtime
        id: runtime
        run: |
          node_version="$(cat .node-version)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "node-version=$node_version" >> "$GITHUB_OUTPUT"
      - name: Detect toolchain changes
        id: toolchain
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          result=$(bunx --no-install stll-toolchain-changed --since "${BASE_SHA:-HEAD^}")
          echo "changed=$(printf '%s' "$result" | jq -r '.changed')" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'VERSION'
              - 'hawk.toml'
              - 'package.json'
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
            build:
              - '__test__/**'
              - 'VERSION'
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'bun.lock'
              - 'index.cjs'
              - 'tsdown.config.ts'
              - 'scripts/**'
              - 'wasm/**'
              - 'npm/**'
            provenance:
              - 'VERSION'
              - 'bun.lock'
              - 'Cargo.lock'
              - '**/package.json'
              - 'Cargo.toml'
              - 'src/**'
              - 'crates/**'
              - 'wasm/**'
              - '*.js'
              - '*.cjs'
              - '*.mjs'
              - '.provenance.yml'
              - 'provenance/**'

  trust-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          HEAD_REPO: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HAS_RUN_CI_LABEL: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_RUN_CI_LABEL" == 'true' ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped."
          fi

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request'
      && needs.trust-check.outputs.trusted == 'true'
    needs: [trust-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: stella/.github/.github/actions/changeset-policy@3e9057a176377ddfa34d7897025934d1feb7ce9f
        with:
          release-paths: |
            src/**
            crates/core/src/**
            Cargo.toml
            crates/core/Cargo.toml
            package.json
            wasm/package.json
            index.cjs
            tsdown.config.ts
          generated-paths: |
            CHANGELOG.md
            VERSION
            Cargo.toml
            crates/core/Cargo.toml
            Cargo.lock
            bun.lock
            package.json
            wasm/package.json
            npm/*/package.json
            index.cjs
            provenance/THIRD-PARTY-NOTICES.txt
            provenance/report.json
            provenance/sbom.cdx.json
          package-files: package.json

  checks:
    name: Tooling invariants
    if: >-
      always()
      && !cancelled()
      && needs.check-changes.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun run check:toolchain
      - run: bun test __test__/tooling-adoption.spec.ts __test__/benchmark-invariants.spec.ts scripts/shared-policy.test.ts scripts/ci-result.test.ts scripts/release-workflow.test.mjs

  napi-ci:
    if: ${{ always() && !cancelled() && needs.check-changes.result == 'success' && (github.event_name != 'pull_request' || needs.trust-check.outputs.trusted == 'true') }}
    needs: [check-changes, trust-check]
    uses: stella/.github/.github/workflows/rust-napi-ci.yml@3e9057a176377ddfa34d7897025934d1feb7ce9f
    with:
      typecheck: true
      node-version: ${{ needs.check-changes.outputs.node-version }}
      trusted: ${{ (github.event_name != 'pull_request' || needs.trust-check.outputs.trusted == 'true') && 'true' || 'false' }}
      rust-changed: ${{ needs.check-changes.outputs.rust-changed }}
      build-changed: ${{ needs.check-changes.outputs.build-changed }}
      provenance-changed: ${{ needs.check-changes.outputs.provenance-changed }}
      provenance-version: v0.1.3
      property-test-command: bun run test:props

  core-package:
    name: Core crate package
    if: >-
      always()
      && !cancelled()
      && needs.check-changes.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
      - name: Verify publication boundary
        run: |
          set -euo pipefail
          cmp LICENSE crates/core/LICENSE
          cargo metadata --format-version 1 --no-deps | jq -e '
            (.packages[] | select(.name == "stella-fuzzy-search").publish) == []
            and (.packages[] | select(.name == "stella-fuzzy-search-core").publish) == ["crates-io"]
          '
      - name: Verify crates.io package
        run: cargo publish --dry-run --locked --package stella-fuzzy-search-core

  hawk:
    name: Hawk
    if: >-
      always()
      && !cancelled()
      && needs.check-changes.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Skip when Hawk is not required
        if: needs.check-changes.outputs.rust-changed != 'true'
        run: echo "No trusted Rust changes; Hawk skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.check-changes.outputs.rust-changed == 'true'
        with:
          toolchain: "1.97.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
        if: needs.check-changes.outputs.rust-changed == 'true'
      - name: Install pinned Hawk
        if: needs.check-changes.outputs.rust-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          expected_hawk_script="cargo +${HAWK_RUST_TOOLCHAIN} hawk check --manifest-path Cargo.toml --target-dir target/hawk -D warnings -A hawk::dead_public -A hawk::unnecessary_public -D hawk::unnecessary_restricted_visibility -D hawk::unnecessary_crate_visibility"
          jq -e --arg expected "$expected_hawk_script" \
            '.scripts["rust:hawk"] == $expected' package.json >/dev/null
          archive="${RUNNER_TEMP}/cargo-hawk.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-hawk"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            --output "$archive" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1 \
            cargo-hawk-x86_64-unknown-linux-gnu/cargo-hawk \
            cargo-hawk-x86_64-unknown-linux-gnu/cargo-hawk-driver
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check internal Rust visibility
        if: needs.check-changes.outputs.rust-changed == 'true'
        run: bun run rust:hawk

  browser:
    name: Browser (Vite + Chromium)
    if: >-
      always()
      && !cancelled()
      && needs.check-changes.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check, napi-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Skip when the build inputs are unchanged
        if: needs.check-changes.outputs.build-changed != 'true'
        run: echo "Build inputs unchanged; browser check skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.check-changes.outputs.build-changed == 'true'
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.check-changes.outputs.build-changed == 'true'
        with:
          node-version-file: .node-version
      - if: needs.check-changes.outputs.build-changed == 'true'
        run: bun install --frozen-lockfile
      # Reuse the WASM binding the NAPI build matrix produced for this run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.check-changes.outputs.build-changed == 'true'
        with:
          name: bindings-wasm32-wasip1-threads
          path: artifacts/wasm
      - name: Build the browser package
        if: needs.check-changes.outputs.build-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp -- artifacts/wasm/*.wasm artifacts/wasm/*.wasi-browser.js .
          cp -- artifacts/wasm/wasi-worker*.mjs .
          bun run build:js
          cp LICENSE NOTICE wasm/
          mkdir -p "$RUNNER_TEMP/pack"
          (cd wasm && bun pm pack --ignore-scripts --destination "$RUNNER_TEMP/pack")
      - name: Install the packed package into a Vite app
        if: needs.check-changes.outputs.build-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/browser-app"
          cp -R __test__/browser "$app"
          # The fixture tsconfig only scopes repository lint; the app does not use it.
          rm -- "$app/tsconfig.json"
          tarballs=("$RUNNER_TEMP"/pack/*.tgz)
          test "${#tarballs[@]}" -eq 1
          cd "$app"
          bun install --frozen-lockfile
          # The tarball changes with every build, so it stays out of the lockfile.
          bun add --no-save "${tarballs[0]}"
          bunx --no-install playwright install --with-deps --only-shell chromium
      - name: Build with Vite and run in Chromium
        if: needs.check-changes.outputs.build-changed == 'true'
        working-directory: ${{ runner.temp }}/browser-app
        run: |
          bun run build
          bun run check

  ci-result:
    if: always()
    needs:
      [
        check-changes,
        trust-check,
        changeset,
        checks,
        napi-ci,
        core-package,
        hawk,
        browser,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject untrusted pull request validation
        if: >-
          github.event_name == 'pull_request'
          && needs.trust-check.outputs.trusted != 'true'
        run: exit 1
      - name: Require every selected validation job
        if: >-
          github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECTOR_RESULT: ${{ needs.check-changes.result }}
          TRUST_RESULT: ${{ needs.trust-check.result }}
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          NAPI_RESULT: ${{ needs.napi-ci.result }}
          CORE_PACKAGE_RESULT: ${{ needs.core-package.result }}
          HAWK_RESULT: ${{ needs.hawk.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          test "$DETECTOR_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$CHECKS_RESULT" = success
          test "$NAPI_RESULT" = success
          test "$CORE_PACKAGE_RESULT" = success
          test "$HAWK_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$TRUST_RESULT" = success
            test "$CHANGESET_RESULT" = success
          else
            case "$TRUST_RESULT" in success|skipped) ;; *) exit 1 ;; esac
            case "$CHANGESET_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          fi
