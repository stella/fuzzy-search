name: Release policy

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce release boundaries
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/release-policy.yml@964e75f409643716a2c8ff29c26235f18d2e34a0
