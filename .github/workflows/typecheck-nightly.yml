name: Nightly compiler parity

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-compiler-parity
  cancel-in-progress: false

jobs:
  napi-ci:
    uses: stella/.github/.github/workflows/rust-napi-ci.yml@5b5e00c3fc77eda2d557815fb3ee148c69314480 # v1.8.0 + conditional parity (#142)
    with:
      trusted: "true"
      typecheck: true
      typecheck-only: true
      parity: always
      install-command: bun install --frozen-lockfile
