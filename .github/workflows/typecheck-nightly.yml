name: Nightly compiler parity

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-compiler-parity
  cancel-in-progress: false

jobs:
  napi-ci:
    uses: stella/.github/.github/workflows/rust-napi-ci.yml@07debc754995bab35e446511859f1d93e1ad127a
    with:
      trusted: "true"
      typecheck: true
      typecheck-only: true
      parity: always
      install-command: bun install --frozen-lockfile
